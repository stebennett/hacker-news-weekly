name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install pinned npm
        run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s tests/runtime -v
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm run build
      - run: npm run verify:dist
      - name: Verify committed output is reproducible
        run: git diff --exit-code -- dist && test -z "$(git ls-files --others --exclude-standard dist)"
